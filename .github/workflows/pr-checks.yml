name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - development

env:
  TF_VERSION: 1.6.0

jobs:
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Check OpenTofu Formatting
        run: |
          echo "Checking format for all .tf files..."
          tofu fmt -check -recursive
        continue-on-error: true

      - name: Validate Root Configuration
        run: |
          tofu init -backend=false
          tofu validate

  test-sql-module:
    name: Test SQL Server Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test SQL Module
        working-directory: ./modules/sql_server
        run: |
          tofu init -backend=false
          tofu validate
          echo "✅ SQL Server module is valid"

  test-databricks-module:
    name: Test Databricks Module
    runs-on: ubuntu-latest
    
    steps:
