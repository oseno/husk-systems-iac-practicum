name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - development

env:
  TF_VERSION: 1.6.0

jobs:
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check Terraform Formatting
        run: |
          echo "Checking format for all .tf files..."
          terraform fmt -check -recursive
        continue-on-error: true

      - name: Validate Root Configuration
        run: |
          terraform init -backend=false
          terraform validate

  test-sql-module:
    name: Test SQL Server Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Test SQL Module
        working-directory: ./modules/sql_server
        run: |
          terraform init -backend=false
          terraform validate
          echo "SQL Server module is valid"

  test-databricks-module:
    name: Test Databricks Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Test Databricks Module
        working-directory: ./modules/databricks_workspace
        run: |
          terraform init -backend=false
          terraform validate
          echo "Databricks module is valid"

  test-stream-analytics-module:
    name: Test Stream Analytics Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Test Stream Analytics Module
        working-directory: ./modules/stream_analytics
        run: |
          terraform init -backend=false
          terraform validate
          echo "Stream Analytics module is valid"

  test-security-module:
    name: Test Security Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Test Security Module
        working-directory: ./modules/security
        run: |
          terraform init -backend=false
          terraform validate
          echo "Security module is valid"

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: 
      - quick-checks
      - test-sql-module
      - test-databricks-module
      - test-stream-analytics-module
      - test-security-module
      - security-check
    if: always()
    
    steps:
      - name: Create PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const sqlStatus = '${{ needs.test-sql-module.result }}' === 'success' ? 'PASS' : 'FAIL';
            const databricksStatus = '${{ needs.test-databricks-module.result }}' === 'success' ? 'PASS' : 'FAIL';
            const streamStatus = '${{ needs.test-stream-analytics-module.result }}' === 'success' ? 'PASS' : 'FAIL';
            const securityStatus = '${{ needs.test-security-module.result }}' === 'success' ? 'PASS' : 'FAIL';
            const checksStatus = '${{ needs.quick-checks.result }}' === 'success' ? 'PASS' : 'FAIL';
            const scanStatus = '${{ needs.security-check.result }}' === 'success' ? 'PASS' : 'FAIL';
            
            const allPass = sqlStatus === 'PASS' && databricksStatus === 'PASS' && 
                           streamStatus === 'PASS' && securityStatus === 'PASS';
            
            const summary = `## Pull Request Validation Summary
            
            ### Module Tests
            - [${sqlStatus}] SQL Server Module
            - [${databricksStatus}] Databricks Module
            - [${streamStatus}] Stream Analytics Module
            - [${securityStatus}] Security Module
            
            ### Additional Checks
            - [${checksStatus}] Format & Validation
            - [${scanStatus}] Security Scan
            
            ---
            
            ${allPass ? '**All checks passed! Safe to merge.**' : '**Some checks failed. Please review before merging.**'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });