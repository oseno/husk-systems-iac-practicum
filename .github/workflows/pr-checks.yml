name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - development

env:
  TF_VERSION: 1.6.0

jobs:
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Cache OpenTofu Providers
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Check OpenTofu Formatting
        run: |
          echo "Checking format for all .tf files..."
          tofu fmt -check -recursive
        continue-on-error: true

      - name: Validate Root Configuration with Retry
        run: |
          for i in {1..3}; do
            tofu init -backend=false && tofu validate && break || {
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            }
          done

  test-sql-module:
    name: Test SQL Server Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

