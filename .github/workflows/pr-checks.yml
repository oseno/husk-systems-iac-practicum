name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - development

env:
  TF_VERSION: 1.6.0

jobs:
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Check OpenTofu Formatting
        run: |
          echo "Checking format for all .tf files..."
          tofu fmt -check -recursive
        continue-on-error: true

      - name: Validate Root Configuration
        run: |
          tofu init -backend=false
          tofu validate

  test-sql-module:
    name: Test SQL Server Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test SQL Module
        working-directory: ./modules/sql_server
        run: |
          tofu init -backend=false
          tofu validate
          echo "✅ SQL Server module is valid"

  test-databricks-module:
    name: Test Databricks Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test Databricks Module
        working-directory: ./modules/databricks_workspace
        run: |
          tofu init -backend=false
          tofu validate
          echo "✅ Databricks module is valid"

  test-stream-analytics-module:
    name: Test Stream Analytics Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test Stream Analytics Module
        working-directory: ./modules/stream_analytics
        run: |
          tofu init -backend=false
          tofu validate
          echo "✅ Stream Analytics module is valid"

  test-security-module:
    name: Test Security Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test Security Module
        working-directory: ./modules/security
        run: |
          tofu init -backend=false
          tofu validate
          echo "✅ Security module is valid"

  test-synapse-module:
    name: Test Synapse Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test Synapse Module
        working-directory: ./modules/synapse_workspace
        run: |
          tofu init -backend=false
          tofu validate
          echo "✅ Synapse module is valid"

  test-storage-module:
    name: Test Storage Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test Storage Module
        working-directory: ./modules/storage_account
        run: |
          tofu init -backend=false
          tofu validate
          echo "✅ Storage module is valid"

  test-app-service-module:
    name: Test App Service Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test App Service Module
        working-directory: ./modules/app_service
        run: |
          tofu init -backend=false
          tofu validate
          echo "✅ App Service module is valid"

  test-function-app-module:
    name: Test Function App Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test Function App Module
        working-directory: ./modules/function_app
        run: |
          tofu init -backend=false
          tofu validate
          echo "✅ Function App module is valid"

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: 
      - quick-checks
      - test-sql-module
      - test-databricks-module
      - test-stream-analytics-module
      - test-security-module
      - test-synapse-module
      - test-storage-module
      - test-app-service-module
      - test-function-app-module
      - security-check
    if: always()
    
    steps:
      - name: Create PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              sql: '${{ needs.test-sql-module.result }}',
              databricks: '${{ needs.test-databricks-module.result }}',
              stream: '${{ needs.test-stream-analytics-module.result }}',
              security: '${{ needs.test-security-module.result }}',
              synapse: '${{ needs.test-synapse-module.result }}',
              storage: '${{ needs.test-storage-module.result }}',
              appService: '${{ needs.test-app-service-module.result }}',
              functionApp: '${{ needs.test-function-app-module.result }}',
              checks: '${{ needs.quick-checks.result }}',
              scan: '${{ needs.security-check.result }}'
            };
            
            const icon = (status) => status === 'success' ? '✅' : '❌';
            
            const allPass = Object.values(results).every(r => r === 'success');
            
            const summary = `## 🔍 Pull Request Validation Summary
            
            ### Module Tests
            ${icon(results.sql)} SQL Server Module
            ${icon(results.databricks)} Databricks Module
            ${icon(results.stream)} Stream Analytics Module
            ${icon(results.security)} Security Module
            ${icon(results.synapse)} Synapse Module
            ${icon(results.storage)} Storage Module
            ${icon(results.appService)} App Service Module
            ${icon(results.functionApp)} Function App Module
            
            ### Additional Checks
            ${icon(results.checks)} Format & Validation
            ${icon(results.scan)} Security Scan
            
            ---
            
            ${allPass ? '✅ **All checks passed! Safe to merge.**' : '⚠️ **Some checks failed. Please review before merging.**'}
            
            **Next Steps:**
            - Merge to \`development\` → Auto-deploy to dev environment
            - Merge to \`main\` → Deploy to production (requires approval)
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });