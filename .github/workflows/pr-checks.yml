name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - development

env:
  TF_VERSION: 1.6.0

jobs:
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Check Terraform Formatting
        run: |
          echo "Checking format for all .tf files..."
          tofu fmt -check -recursive
        continue-on-error: true

      - name: Validate Root Configuration
        run: |
          tofu init -backend=false
          tofu validate

  test-sql-module:
    name: Test SQL Server Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test SQL Module
        working-directory: ./modules/sql_server
        run: |
          tofu init -backend=false
          tofu validate
          echo "SQL Server module is valid"

  test-databricks-module:
    name: Test Databricks Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test Databricks Module
        working-directory: ./modules/databricks_workspace
        run: |
          tofu init -backend=false
          tofu validate
          echo "Databricks module is valid"

  test-stream-analytics-module:
    name: Test Stream Analytics Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test Stream Analytics Module
        working-directory: ./modules/stream_analytics
        run: |
          tofu init -backend=false
          tofu validate
          echo "Stream Analytics module is valid"

  test-security-module:
    name: Test Security Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Test Security Module
        working-directory: ./modules/security
        run: |
          tofu init -backend=false
          tofu validate
          echo "Security module is valid"

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true
          quiet: true
          output_format: cli
          skip_check: CKV_AZURE_225,CKV_AZURE_212,CKV_AZURE_211,CKV_AZURE_18,CKV_AZURE_88,CKV_AZURE_63,CKV_AZURE_66,CKV_AZURE_13,CKV_AZURE_65,CKV_AZURE_213

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: 
      - quick-checks
      - test-sql-module
      - test-databricks-module
      - test-stream-analytics-module
      - test-security-module
      - security-check
    if: always()
    
    steps:
      - name: Print PR Summary
        run: |
          echo "==================================="
          echo "Pull Request Validation Summary"
          echo "==================================="
          echo "SQL Server Module: ${{ needs.test-sql-module.result }}"
          echo "Databricks Module: ${{ needs.test-databricks-module.result }}"
          echo "Stream Analytics Module: ${{ needs.test-stream-analytics-module.result }}"
          echo "Security Module: ${{ needs.test-security-module.result }}"
          echo "Format & Validation: ${{ needs.quick-checks.result }}"
          echo "Security Scan: ${{ needs.security-check.result }}"
          echo "==================================="