name: OpenTofu CI/CD - All Modules

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'modules/**'
      - '*.tf'
      - 'backend.conf'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

env:
  TF_VERSION: 1.6.0
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}           # Service Principal App ID
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}   # Service Principal secret
  ARM_STORAGE_ACCOUNT_NAME: devsynapsesamcwpbv
  ARM_CONTAINER_NAME: opentofu-state
  ARM_RESOURCE_GROUP_NAME: rg-prod-in-cmu
  ARM_STORAGE_ACCOUNT_KEY: ${{ secrets.ARM_STORAGE_ACCOUNT_KEY }}

jobs:
  validate-modules:
    name: Validate All Modules
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        module:
          - databricks_workspace
          - stream_analytics
          - sql_server
          - security
          - budget
          - synapse_workspace
          - storage_account
          - app_service
          - function_app
          - resource_group
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Cache OpenTofu Providers
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: OpenTofu Format Check
        working-directory: ./modules/${{ matrix.module }}
        run: tofu fmt -check -recursive
        continue-on-error: true

      - name: OpenTofu Init (No Backend) with Retry
        working-directory: ./modules/${{ matrix.module }}
        run: |
          for i in {1..3}; do
            tofu init -backend=false && break || {
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            }
          done

      - name: OpenTofu Validate
        working-directory: ./modules/${{ matrix.module }}
        run: tofu validate

      - name: Module Validation Success
        run: echo "✅ Module ${{ matrix.module }} validation passed"

  validate-monitoring-submodules:
    name: Validate Monitoring Submodules
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        submodule:
          - log_analytics_workspace
          - app_insights
          - alerts
          - dashboard
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Cache OpenTofu Providers
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Check if submodule exists
        id: check
        run: |
          if [ -d "./modules/monitoring/${{ matrix.submodule }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: OpenTofu Init (No Backend) with Retry
        if: steps.check.outputs.exists == 'true'
        working-directory: ./modules/monitoring/${{ matrix.submodule }}
        run: |
          for i in {1..3}; do
            tofu init -backend=false && break || {
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            }
          done

      - name: OpenTofu Validate
        if: steps.check.outputs.exists == 'true'
        working-directory: ./modules/monitoring/${{ matrix.submodule }}
        run: tofu validate

      - name: Submodule Validation Success
        if: steps.check.outputs.exists == 'true'
        run: echo "✅ Monitoring submodule ${{ matrix.submodule }} validation passed"

      - name: Submodule Not Found
        if: steps.check.outputs.exists == 'false'
        run: echo "⚠️ Monitoring submodule ${{ matrix.submodule }} not found, skipping"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate-modules
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli

  # Only run plan/apply for push events, not PRs
  opentofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    needs: [validate-modules, security-scan]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Cache OpenTofu Providers
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Set State Key Based on Branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ARM_KEY=prod/terraform.tfstate" >> $GITHUB_ENV
            echo "📦 Using production state"
          else
            echo "ARM_KEY=dev/terraform.tfstate" >> $GITHUB_ENV
            echo "📦 Using development state"
          fi

      - name: OpenTofu Init with Retry
        run: |
          for i in {1..3}; do
            tofu init -backend-config=backend.conf && break || {
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            }
          done

      - name: OpenTofu Plan
        run: tofu plan -out=tfplan
        env:
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}

      - name: Save Plan
        uses: actions/upload-artifact@v4
        with:
          name: opentofu-plan
          path: tfplan
          retention-days: 5

  opentofu-apply-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: opentofu-plan
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    environment: development
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Cache OpenTofu Providers
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Set Development State Key
        run: echo "ARM_KEY=dev/terraform.tfstate" >> $GITHUB_ENV

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: opentofu-plan

      - name: OpenTofu Init with Retry
        run: |
          for i in {1..3}; do
            tofu init -backend-config=backend.conf && break || {
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            }
          done

      - name: OpenTofu Apply
        run: tofu apply -auto-approve tfplan
        env:
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}

      - name: Deployment Complete
        run: |
          echo "✅ Development deployment successful!"
          echo "🎯 Namespace: dev/terraform.tfstate"
          echo "👤 Triggered by: ${{ github.actor }}"

  opentofu-apply-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: opentofu-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Cache OpenTofu Providers
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Set Production State Key
        run: echo "ARM_KEY=prod/terraform.tfstate" >> $GITHUB_ENV

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: opentofu-plan

      - name: OpenTofu Init with Retry
        run: |
          for i in {1..3}; do
            tofu init -backend-config=backend.conf && break || {
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            }
          done

      - name: OpenTofu Apply
        run: tofu apply -auto-approve tfplan
        env:
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}

      - name: Deployment Complete
        run: |
          echo "🎉 Production deployment successful!"
          echo "🎯 Namespace: prod/terraform.tfstate"
          echo "👤 Triggered by: ${{ github.actor }}"

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [opentofu-apply-prod]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Verify SQL Server
        run: |
          echo "🔍 Verifying SQL Server deployment..."
          az sql server list --resource-group rg-prod-ng-cmu --output table || echo "⚠️ No SQL servers found"

      - name: Verify Databricks
        run: |
          echo "🔍 Verifying Databricks workspace..."
          az databricks workspace list --resource-group rg-prod-ng-cmu --output table || echo "⚠️ No Databricks workspaces found"

      - name: Verify Stream Analytics
        run: |
          echo "🔍 Verifying Stream Analytics job..."
          az stream-analytics job list --resource-group rg-prod-ng-cmu --output table || echo "⚠️ No Stream Analytics jobs found"

      - name: Verify Synapse
        run: |
          echo "🔍 Verifying Synapse workspace..."
          az synapse workspace list --resource-group rg-prod-ng-cmu --output table || echo "⚠️ No Synapse workspaces found"

      - name: Verify Storage Accounts
        run: |
          echo "🔍 Verifying Storage accounts..."
          az storage account list --resource-group rg-prod-ng-cmu --output table

      - name: All Verifications Complete
        run: echo "✅ All resource verifications complete"

  notify-dev:
    name: Send Dev Notification
    runs-on: ubuntu-latest
    needs: [opentofu-apply-dev]
    if: always() && (github.ref == 'refs/heads/development' && github.event_name == 'push')
    
    steps:
      - name: Send Success Notification
        if: needs.opentofu-apply-dev.result == 'success'
        run: |
          echo "🎉 Development deployment succeeded!"
          echo "📦 All modules deployed to dev namespace"
          echo "🌿 Branch: development"
          echo "👤 Triggered by: ${{ github.actor }}"

      - name: Send Failure Notification
        if: needs.opentofu-apply-dev.result == 'failure'
        run: |
          echo "❌ Development deployment failed!"
          echo "📋 Check the logs for details"
          echo "👤 Triggered by: ${{ github.actor }}"

  notify-prod:
    name: Send Prod Notification
    runs-on: ubuntu-latest
    needs: [opentofu-apply-prod, verify-deployment]
    if: always() && (github.ref == 'refs/heads/main' && github.event_name == 'push')
    
    steps:
      - name: Send Success Notification
        if: needs.opentofu-apply-prod.result == 'success'
        run: |
          echo "🎉 Production deployment succeeded!"
          echo "📦 All modules deployed to production"
          echo "🌳 Branch: main"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "✅ Verification complete"

      - name: Send Failure Notification
        if: needs.opentofu-apply-prod.result == 'failure'
        run: |
          echo "❌ Production deployment failed!"
          echo "📋 Check the logs for details"
          echo "👤 Triggered by: ${{ github.actor }}"